[package]
name = "kite"
version = "2026.9.17"
edition = "2024"
description = "Fast quicksaves and inspectable AI-assisted landing"

[[bin]]
name = "kt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
fs2 = "0.4.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
