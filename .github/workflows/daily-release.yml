name: Daily Release

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      cargo_version: ${{ steps.meta.outputs.cargo_version }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      should_release: ${{ steps.meta.outputs.should_release }}
      tag_exists: ${{ steps.meta.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare release files
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prepare_release.py

      - name: Test release source
        if: steps.meta.outputs.should_release == 'true'
        run: cargo test --locked

      - name: Upload release metadata
        if: steps.meta.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            release_notes.md
            Cargo.toml
            Cargo.lock
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 7

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Apply tested release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and verify release binary
        env:
          TARGET: ${{ matrix.target }}
          CARGO_VERSION: ${{ needs.prepare.outputs.cargo_version }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET"
          binary="target/$TARGET/release/kt"
          if [[ "$TARGET" == *windows-msvc ]]; then binary="$binary.exe"; fi
          test "$("$binary" --version)" = "kt $CARGO_VERSION"

      - name: Package release archive
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import tarfile
          import zipfile

          release_tag = os.environ["RELEASE_TAG"]
          target = os.environ["TARGET"]
          archive_ext = os.environ["ARCHIVE_EXT"]

          binary_name = "kt.exe" if target.endswith("windows-msvc") else "kt"
          source = Path("target") / target / "release" / binary_name
          if not source.exists():
              raise SystemExit(f"Built binary not found: {source}")

          dist = Path("dist")
          package_root = dist / f"kt-{release_tag}-{target}"
          package_root.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source, package_root / binary_name)

          if archive_ext == "zip":
              archive_path = dist / f"{package_root.name}.zip"
              with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_DEFLATED) as archive:
                  archive.write(package_root / binary_name, arcname=f"{package_root.name}/{binary_name}")
          else:
              archive_path = dist / f"{package_root.name}.tar.gz"
              with tarfile.open(archive_path, "w:gz") as archive:
                  archive.add(package_root / binary_name, arcname=f"{package_root.name}/{binary_name}")

          checksum_path = dist / f"{archive_path.name}.sha256"
          checksum = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          checksum_path.write_text(f"{checksum}  {archive_path.name}\n")
          shutil.rmtree(package_root)
          PY

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Use the source that was built. If the default branch advanced during
      # builds, an ordinary push rejects it without overwriting newer changes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifact-*
          path: dist
          merge-multiple: true

      - name: Commit and tag the tested source
        if: needs.prepare.outputs.tag_exists == 'false'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(release): $RELEASE_TAG [skip-ci]"
          git tag "$RELEASE_TAG"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$RELEASE_TAG"

      # A draft keeps partial uploads private. Retrying uses the existing tag
      # and replaces its draft assets before making the release public.
      - name: Upload release draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: Release ${{ needs.prepare.outputs.release_tag }}
          body_path: release_notes.md
          files: dist/*
          fail_on_unmatched_files: true
          draft: true

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
