name: Review cleanup tests

on:
  pull_request:
    paths:
      - .github/workflows/tidy-pullfrog-reviews.yml
      - .github/workflows/test-review-cleanup.yml
      - .github/tests/tidy-pullfrog-reviews.test.cjs

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test .github/tests/tidy-pullfrog-reviews.test.cjs
